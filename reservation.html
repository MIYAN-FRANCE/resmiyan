<script>

const t = k => T[st.lang][k];
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };

const longDate = (s, lang) => new Intl.DateTimeFormat((lang||st.lang)==='fr'?'fr-FR':'en-GB',{weekday:'long',day:'numeric',month:'long'}).format(fromIso(s));
const el = (tag, attrs, text) => { const e=document.createElement(tag); Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v)); if(text!=null) e.textContent=text; return e; };

/* ═══ Suivi : consentement + Google Ads + Meta ═══
   Aucun script tiers n'est chargé avant « Tout accepter ». Le Consent Mode v2 est initialisé à « denied »
   (simple push dans dataLayer, aucune requête réseau). Aucune donnée personnelle n'est envoyée : seulement
   l'identifiant de réservation (MY-xxxxxx), qui sert à dédupliquer. */
window.dataLayer = window.dataLayer || [];
function gtag() { dataLayer.push(arguments); }            // doit pousser « arguments », pas un tableau
const CONSENT_KEY = 'miyan-resa-consent';
const consentState = v => ({ ad_storage:v, ad_user_data:v, ad_personalization:v, analytics_storage:v });
gtag('consent', 'default', consentState('denied'));

const META_STANDARD_EVENTS = ['AddPaymentInfo','AddToCart','AddToWishlist','CompleteRegistration','Contact','CustomizeProduct','Donate','FindLocation','InitiateCheckout','Lead','Purchase','Schedule','Search','StartTrial','SubmitApplication','Subscribe','ViewContent'];
let memConsent = null, googleLoaded = false, metaLoaded = false;
let bookingTracked = false;   // garde anti-doublon : un seul passage par réservation (ni rechargement d'écran, ni changement de langue)
let pendingBookingId = null;  // réservation confirmée avant que le visiteur ait accepté : envoyée seulement s'il accepte ensuite

function readConsent() {
  try {
    const v = JSON.parse(localStorage.getItem(CONSENT_KEY));
    if (v && v.expiresAt > Date.now() && (v.choice === 'accepted' || v.choice === 'refused')) return v.choice;
  } catch (e) {}
  return memConsent || 'unknown';   // repli mémoire si localStorage est indisponible (navigation privée…)
}
function saveConsent(choice) {
  memConsent = choice;
  const d = new Date(); d.setMonth(d.getMonth() + 6);   // durée de validité : 6 mois, comme sur miyan.fr
  try { localStorage.setItem(CONSENT_KEY, JSON.stringify({ version:1, choice, expiresAt:d.getTime() })); } catch (e) {}
}
function loadScript(id, src) {
  if (document.getElementById(id)) return;
  const s = document.createElement('script'); s.id = id; s.async = true; s.src = src; document.head.appendChild(s);
}
function loadGoogle() {
  if (googleLoaded) return; googleLoaded = true;
  gtag('consent', 'update', consentState('granted'));      // dont ad_personalization (remarketing, demande de Léo)
  gtag('js', new Date());
  gtag('config', GADS_ID);                                 // send_page_view laissé par défaut (true), pour les audiences
  loadScript('miyan-gtag', 'https://www.googletagmanager.com/gtag/js?id=' + GADS_ID);
}
function loadMeta() {
  if (metaLoaded) return; metaLoaded = true;
  if (!window.fbq) {
    const f = function () { f.callMethod ? f.callMethod.apply(f, arguments) : f.queue.push(arguments); };
    f.queue = []; f.push = f; f.loaded = true; f.version = '2.0'; window.fbq = window._fbq = f;
  }
  fbq('consent', 'grant');
  fbq('init', META_PIXEL_ID);
  fbq('track', 'PageView');
  loadScript('miyan-fbevents', 'https://connect.facebook.net/en_US/fbevents.js');
}
function clearTrackingCookies() {
  const names = document.cookie.split(';').map(c => c.split('=')[0].trim()).filter(n => /^(_fbp|_fbc|_gcl_.*|_ga.*|_gid|_gac_.*)$/.test(n));
  const h = location.hostname.split('.');
  const domains = ['', ...h.slice(0, -1).map((_, i) => h.slice(i).join('.'))];
  names.forEach(n => domains.forEach(d => { document.cookie = `${n}=; Max-Age=0; path=/;${d ? ` domain=${d};` : ''}`; }));
}

// Conversion « Réservation confirmée » : appelée UNIQUEMENT quand l'API a répondu ok.
function trackBookingConfirmed(id) {
  if (bookingTracked) return;
  bookingTracked = true;
  pendingBookingId = id || 'OK';
  sendConversion();
}
function sendConversion() {
  if (pendingBookingId === null || readConsent() !== 'accepted') return;   // sans consentement : rien ne part
  const id = pendingBookingId; pendingBookingId = null;
  if (DEMO) { console.info('[suivi] Mode DEMO : conversion NON envoyée (réservation ' + id + ')'); return; }
  const tid = id !== 'OK' ? String(id) : null;
  const g = { send_to: GADS_CONV_BOOKING }; if (tid) g.transaction_id = tid;   // pas de « value » : une table n'a pas de montant
  gtag('event', 'conversion', g);
  const meta = [META_STANDARD_EVENTS.includes(META_EVENT) ? 'track' : 'trackCustom', META_EVENT, {}];
  if (tid) meta.push({ eventID: tid });                                        // déduplication côté Meta
  fbq.apply(null, meta);
}

// Bannière
const banner = () => $('cookie');
function fitBanner() { document.body.style.paddingBottom = banner().hidden ? '' : (banner().offsetHeight + 32) + 'px'; }   // le formulaire reste atteignable sous la bannière
function showBanner(reopened) {
  $('cookieKeep').hidden = !reopened;
  banner().hidden = false; fitBanner();
  if (reopened) $('cookieTitle').focus();
}
function hideBanner() { banner().hidden = true; fitBanner(); }
function setConsent(choice) {
  saveConsent(choice); hideBanner();
  if (choice === 'accepted') { loadGoogle(); loadMeta(); sendConversion(); }
  else {                                          // refus (ou retrait d'un accord précédent)
    pendingBookingId = null;
    if (googleLoaded) gtag('consent', 'update', consentState('denied'));
    if (metaLoaded) fbq('consent', 'revoke');
    if (googleLoaded || metaLoaded) clearTrackingCookies();
  }
}
function initConsent() {
  $('cookieAccept').onclick = () => setConsent('accepted');
  $('cookieRefuse').onclick = () => setConsent('refused');
  $('cookieKeep').onclick = hideBanner;
  $('cookieLink').onclick = () => showBanner(readConsent() !== 'unknown');
  if (window.ResizeObserver) new ResizeObserver(fitBanner).observe(banner());
  const c = readConsent();
  if (c === 'accepted') { loadGoogle(); loadMeta(); } else if (c === 'unknown') showBanner(false);
}

function renderTexts() {
  document.documentElement.lang = st.lang;
  document.title = 'MIYAN | ' + t('title');   // même format d'onglet que miyan.fr : « MIYAN | … »
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang===st.lang));
  const g = $('groupHint'); g.textContent = T[st.lang].group(st.cfg.maxParty);
  g.append(el('a',{href:'mailto:'+st.cfg.email}, st.cfg.email));
}

function renderParty() {
  const box = $('party'); box.textContent='';
  for (let n=1; n<=st.cfg.maxParty; n++) {
    const b = el('button',{type:'button',class:'chip','aria-pressed':n===st.party}, n);
    b.onclick = () => { st.party=n; renderParty(); loadSlots(); };
    box.append(b);
  }
}

function renderDays() {
  const box = $('days'); box.textContent='';
  const loc = st.lang==='fr'?'fr-FR':'en-GB';
  for (let i=0; i<Math.min(14, st.cfg.maxDays+1); i++) {
    const d = plus(i), s = iso(d);
    const b = el('button',{type:'button',class:'chip','aria-pressed':s===st.date,'aria-label':longDate(s)});
    b.append(el('small',null,new Intl.DateTimeFormat(loc,{weekday:'short'}).format(d)), document.createTextNode(d.getDate()+' '), el('small',null,new Intl.DateTimeFormat(loc,{month:'short'}).format(d)));
    b.onclick = () => pickDate(s);
    box.append(b);
  }
  const o = $('otherDate'); o.min = iso(today()); o.max = iso(plus(st.cfg.maxDays)); o.value = st.date || '';
}

function pickDate(s) { st.date=s; st.time=null; renderDays(); loadSlots(); }

function renderSlots() {
  const box = $('slots'); box.textContent='';
  const msg = k => box.append(el('p',{class:'hint'},t(k)));
  if (!st.date) return msg('pick');
  if (st.loading) return msg('loading');
  if (!st.slots || !st.slots.length) return msg('closed');
  if (!st.slots.some(s=>s.available)) return msg('none');
  ['midi','soir'].forEach(svc => {
    const list = st.slots.filter(s=>s.service===svc);
    if (!list.length) return;
    box.append(el('div',{class:'svc'},t(svc)));
    const row = el('div',{class:'row'});
    list.forEach(s => {
      const b = el('button',{type:'button',class:'chip','aria-pressed':s.time===st.time}, s.time);
      b.disabled = !s.available;
      b.onclick = () => { st.time=s.time; renderSlots(); renderRecap(); };
      row.append(b);
    });
    box.append(row);
  });
}

function recapText(lang) { lang = lang || st.lang; return `${longDate(st.date, lang)} ${T[lang].at} ${st.time} · ${T[lang].pers(st.party)}`; }

// Réaffiche l'écran de confirmation dans la langue donnée : appelé à la fin de la réservation,
// et de nouveau si le client change de langue alors que cet écran est déjà affiché.
function renderDoneScreen(lang) {
  document.querySelectorAll('#done [data-t]').forEach(e => e.textContent = T[lang][e.dataset.t]);
  const id = st.lastBookingId;
  $('doneRecap').textContent = recapText(lang) + (id && id !== 'OK' ? ` · ${T[lang].ref} ${id}` : '');
}
function renderRecap() { const r=$('recap'); r.hidden = !(st.date&&st.time); if(!r.hidden) r.textContent = recapText(); }

let reqId = 0;
async function loadSlots() {
  $('err').textContent=''; renderRecap();
  if (!st.date) return renderSlots();
  const mine = ++reqId; st.loading=true; renderSlots();
  let res;
  try { res = await api('GET', {action:'slots', date:st.date, party:st.party}); } catch(e) { res = {ok:false}; }
  if (mine !== reqId) return;
  st.loading=false; st.slots = res.ok ? res.slots : [];
  if (res.config) applyCfg(res.config);
  if (!st.slots.some(s=>s.time===st.time && s.available)) st.time=null;
  renderSlots(); renderRecap();
}

function applyCfg(c) {
  const changed = c.maxParty!==st.cfg.maxParty || c.maxDays!==st.cfg.maxDays;
  Object.assign(st.cfg, c); if (!st.cfg.email) st.cfg.email='contact@miyan.fr';
  if (st.party>st.cfg.maxParty) st.party=st.cfg.maxParty;
  if (changed) { renderParty(); renderDays(); renderTexts(); }
}

async function api(method, data) {
  if (DEMO) return demoApi(method, data);
  if (method==='GET') return (await fetch(API_URL+'?'+new URLSearchParams(data))).json();
  // text/plain évite la pré-requête CORS, non gérée par Apps Script
  return (await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})).json();
}
function demoApi(method, data) {
  return new Promise(r => setTimeout(() => {
    if (method==='POST') return r({ok:true,id:'MY-DEMO01'});
    const slots=[]; const add=(svc,a,z)=>{ for(let m=a;m<=z;m+=15) slots.push({time:pad(Math.floor(m/60))+':'+pad(m%60),service:svc,available:(m/15)%5!==0}); };
    add('midi',720,840); add('soir',1140,1320); r({ok:true,slots,config:st.cfg});
  }, 350));
}

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('err'), btn = $('submit');
  const lang = st.lang; // figée ici : si la langue est changée pendant l'envoi, la confirmation reste cohérente
  const firstName=$('firstName').value.trim(), lastName=$('lastName').value.trim();
  const phone=$('phone').value.trim(), email=$('email').value.trim();
  const fail = (k, id) => { err.textContent=t(k); if(id) $(id).focus(); };
  if (!st.date || !st.time) return fail('eSlot');
  if (!firstName) return fail('eName','firstName');
  if (!lastName) return fail('eName','lastName');
  if (phone.replace(/\D/g,'').length < 8) return fail('ePhone','phone');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('eEmail','email');
  err.textContent=''; btn.disabled=true; btn.textContent=t('sending');
  let res;
  try { res = await api('POST',{date:st.date,time:st.time,party:st.party,firstName,lastName,phone,email,note:$('note').value.trim(),lang,website:$('website').value}); }
  catch(e) { res={ok:false}; }
  btn.disabled=false; btn.textContent=t('submit');
  if (res.ok) {
    st.lastBookingId = res.id;
    renderDoneScreen(lang);
    $('form').hidden=true; $('done').hidden=false; window.scrollTo({top:0});
    try { trackBookingConfirmed(res.id); } catch(e) {}   // le suivi ne doit jamais perturber la réservation
  } else if (res.error==='full') { err.textContent=t('eFull'); loadSlots(); }
  else err.textContent=t('eNet');
});

$('otherDate').addEventListener('change', e => { if (e.target.value) pickDate(e.target.value); });
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  st.lang=b.dataset.lang; renderTexts(); renderDays(); renderSlots(); renderRecap();
  if (!$('done').hidden) renderDoneScreen(st.lang);
});

$('demo').hidden = !DEMO;
renderTexts(); renderParty(); renderDays(); renderSlots(); initConsent();
if (!DEMO) api('GET',{}).then(r => r && r.config && applyCfg(r.config)).catch(()=>{});
</script>
</body>
</html>
